<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Gate Analytics Dashboard</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --border-color: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }
        
        .container { max-width: 1200px; margin: 0 auto; }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 1.8rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        header h1 span { color: var(--accent-primary); }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--accent-success); background: rgba(16, 185, 129, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .dot { width: 8px; height: 8px; background-color: var(--accent-success); border-radius: 50%; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background-color: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .stat-card.entered::before { background-color: var(--accent-primary); }
        .stat-card.exited::before { background-color: var(--accent-danger); }
        .stat-card.inside::before { background-color: var(--accent-success); }
        
        .stat-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stat-value { font-size: 2.8rem; font-weight: 700; }
        .stat-card.entered .stat-value { color: var(--accent-primary); }
        .stat-card.exited .stat-value { color: var(--accent-danger); }
        .stat-card.inside .stat-value { color: var(--accent-success); }

        /* Table Section */
        .table-container { background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .table-header { padding: 20px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .table-header h2 { font-size: 1.2rem; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(255, 255, 255, 0.02); padding: 15px 25px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-color); }
        td { padding: 15px 25px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        /* Badges */
        .plate-badge { background-color: #fbbf24; color: #000; padding: 5px 12px; border-radius: 6px; font-weight: 700; font-family: 'Courier New', monospace; font-size: 1.1rem; letter-spacing: 1px; }
        .plate-badge.exit { background-color: var(--border-color); color: var(--text-muted); }
        
        .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.in { background-color: rgba(16, 185, 129, 0.15); color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-badge.out { background-color: rgba(239, 68, 68, 0.15); color: var(--accent-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .time-cell { color: var(--text-muted); font-size: 0.9rem; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><span>🏬</span> Mall Gate Analytics</h1>
            <div class="status-indicator">
                <div class="dot"></div>
                System Live
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card entered">
                <div class="stat-title">Total Vehicles Entered</div>
                <div class="stat-value" id="totalEntered">0</div>
            </div>
            <div class="stat-card exited">
                <div class="stat-title">Total Vehicles Exited</div>
                <div class="stat-value" id="totalExited">0</div>
            </div>
            <div class="stat-card inside">
                <div class="stat-title">Currently Inside Mall</div>
                <div class="stat-value" id="totalInside">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Live Vehicle Log</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Plate Number</th>
                        <th>Event Type</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr><td colspan="4" class="loading">Connecting to database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const channelID = "3560920"; 

        async function fetchData() {
            try {
                const response = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?results=100`, { mode: 'cors' });
                const data = await response.json();
                
                let entered = 0;
                let exited = 0;
                const tbody = document.getElementById('logTableBody');
                tbody.innerHTML = '';

                if (data.feeds.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="loading">Waiting for vehicle data...</td></tr>';
                    return;
                }

                // Reverse to show newest first
                const feeds = data.feeds.reverse();

                // Calculate totals
                feeds.forEach(feed => {
                    if (feed.field2 === 'ENTRY') entered++;
                    if (feed.field2 === 'EXIT') exited++;
                });

                // Update Cards
                document.getElementById('totalEntered').innerText = entered;
                document.getElementById('totalExited').innerText = exited;
                
                let inside = entered - exited;
                if (inside < 0) inside = 0;
                document.getElementById('totalInside').innerText = inside;

                // Populate Table
                feeds.forEach((feed, index) => {
                    const plate = feed.field1 || 'UNKNOWN';
                    const event = feed.field2 || 'EVENT';
                    const time = new Date(feed.created_at).toLocaleString();
                    
                    // Styling for Exit events
                    let plateDisplay = `<span class="plate-badge">${plate}</span>`;
                    if (event === 'EXIT') {
                        plateDisplay = `<span class="plate-badge exit">EXITED</span>`;
                    }

                    const badgeClass = event === 'ENTRY' ? 'in' : 'out';

                    tbody.innerHTML += `
                        <tr>
                            <td>${feeds.length - index}</td>
                            <td>${plateDisplay}</td>
                            <td><span class="status-badge ${badgeClass}">${event}</span></td>
                            <td class="time-cell">${time}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
