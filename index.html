<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Gate System Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--card-bg); }
        header h1 { color: var(--accent-blue); font-size: 2.2rem; }
        header p { color: var(--text-muted); margin-top: 5px; }

        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .card h3 { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .card .value { font-size: 2rem; font-weight: bold; }
        .value.blue { color: var(--accent-blue); }
        .value.green { color: var(--accent-green); }

        .table-container { background-color: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid #334155; overflow-x: auto; }
        .table-container h2 { color: var(--accent-blue); margin-bottom: 20px; font-size: 1.4rem; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        
        .plate { background-color: #fbbf24; color: #000; padding: 3px 10px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .status-badge.in { background-color: rgba(74, 222, 128, 0.2); color: var(--accent-green); }
        .status-badge.out { background-color: rgba(248, 113, 113, 0.2); color: var(--accent-red); }
        
        .loading { text-align: center; color: var(--text-muted); padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏬 Automatic Mall Gate</h1>
            <p>Live Vehicle Logging</p>
        </header>

        <div class="status-grid">
            <div class="card">
                <h3>Total Cars Entered</h3>
                <div class="value green" id="totalIn">0</div>
            </div>
            <div class="card">
                <h3>Total Cars Exited</h3>
                <div class="value blue" id="totalOut">0</div>
            </div>
        </div>

        <div class="table-container">
            <h2>📋 Live Database Log</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Data (Field 1)</th>
                        <th>Time</th>
                        <th>Event (Field 2)</th>
                    </tr>
                </thead>
                <tbody id="logTable">
                    <tr><td colspan="4" class="loading">Connecting to database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const channelID = "3560920"; 

        async function fetchRealData() {
            try {
                // Fetch the latest 50 records from ThingSpeak
                const response = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?results=50`, { mode: 'cors' });
                const data = await response.json();
                
                const table = document.getElementById('logTable');
                let totalEntries = 0;
                let totalExits = 0;
                table.innerHTML = '';

                if (data.feeds.length === 0) {
                    table.innerHTML = '<tr><td colspan="4" class="loading">No data yet. Trigger the ESP32.</td></tr>';
                    return;
                }

                // ThingSpeak returns oldest first, so we reverse it to show newest at the top
                const feeds = data.feeds.reverse();
                
                feeds.forEach((feed, index) => {
                    // Count totals
                    if (feed.field2 === 'ENTRY') totalEntries++;
                    if (feed.field2 === 'EXIT') totalExits++;

                    const data1 = feed.field1 || '—'; // Plate number
                    const data2 = feed.field2 || '—'; // ENTRY or EXIT
                    const time = new Date(feed.created_at).toLocaleString();
                    
                    // Create the row
                    table.innerHTML += `
                        <tr>
                            <td>${feeds.length - index}</td>
                            <td><span class="plate">${data1}</span></td>
                            <td>${time}</td>
                            <td><span class="status-badge ${data2 === 'ENTRY' ? 'in' : 'out'}">${data2}</span></td>
                        </tr>
                    `;
                });

                // Update the counters at the top
                document.getElementById('totalIn').innerText = totalEntries;
                document.getElementById('totalOut').innerText = totalExits;

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('logTable').innerHTML = '<tr><td colspan="4" class="loading" style="color: #f87171;">Error connecting to database.</td></tr>';
            }
        }

        // Run immediately, then every 5 seconds
        fetchRealData();
        setInterval(fetchRealData, 5000);
    </script>
</body>
</html>
